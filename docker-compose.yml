version: "3.8"

# ============================================================
# 关键工业设备可预测性维护（PdM）与排障智能体
# 架构：Docker Compose 微服务（禁止 Systemd）
# ============================================================

services:
  # ===================== 基础设施层 =====================

  mysql:
    image: mysql:8.0
    container_name: pdm_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pdm_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pdm_system}
      MYSQL_USER: ${MYSQL_USER:-pdm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pdm_pass_2026}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=200
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-pdm_root_2026}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: pdm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pdm_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"

  # ===================== 应用服务层 =====================

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: pdm_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-pdm_user}:${MYSQL_PASSWORD:-pdm_pass_2026}@mysql:3306/${MYSQL_DATABASE:-pdm_system}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-minioadmin2026}
      - MINIO_BUCKET=pdm-manuals
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    container_name: pdm_agent
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-pdm_user}:${MYSQL_PASSWORD:-pdm_pass_2026}@mysql:3306/${MYSQL_DATABASE:-pdm_system}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-minioadmin2026}
      - MINIO_BUCKET=pdm-manuals
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - FEATURE_EXTRACT_INTERVAL=60
      - AGENT_AUTO_ANALYZE=true
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    ports:
      - "8100:8100"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  sensor-sim:
    build:
      context: ./services/sensor-sim
      dockerfile: Dockerfile
    container_name: pdm_sensor_sim
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:8000
      - SIM_MODE=${SIM_MODE:-degradation}
      - SIM_SPEED=${SIM_SPEED:-1.0}
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: pdm_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - agent

  # ===================== 网关层 =====================

  nginx:
    image: nginx:alpine
    container_name: pdm_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - agent

# ============================================================
# Networks & Volumes（显式声明便于调试）
# ============================================================
networks:
  default:
    name: pdm_network
    driver: bridge
