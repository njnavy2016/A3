# ============================================================
# PdM Agent Nginx 主配置（挂载到 /etc/nginx/nginx.conf）
# 注意：这是「主配置」，必须包含 events {} 和 http {} 层级
#       upstream / limit_req_zone 只能写在 http 块内
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/pdm_access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 20m;

    gzip  on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # =============== 限流（必须位于 http 上下文） ===============
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # =============== 上游服务（必须位于 http 上下文） ===============
    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:8000;
    }

    upstream agent {
        server agent:8100;
    }

    server {
        listen 80;
        server_name _;

        # =============== 前端静态资源（优先） ===============
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SPA 路由支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # =============== 后端 API ===============
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_connect_timeout 30s;
        }

        # =============== 智能体 API（前端实际使用 /agent-api → /api/v1） ===============
        location /agent-api/ {
            proxy_pass http://agent/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 180s;      # LLM 推理较慢
            proxy_send_timeout 180s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
        }

        # =============== 智能体 API（原始路径直连） ===============
        location /agent/ {
            proxy_pass http://agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;      # LLM 推理可能较慢
            proxy_send_timeout 120s;

            # SSE / 流式输出
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
        }

        # =============== 健康检查 ===============
        location /backend-health {
            proxy_pass http://backend/health;
            access_log off;
        }

        location /agent-health {
            proxy_pass http://agent/health;
            access_log off;
        }

        # =============== 安全头 ===============
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
